  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface active:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface truncate px-space-xs">Chip In Action</h1><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col w-full px-space-lg pt-14 pb-safe bg-surface"><div class="flex flex-col w-full relative">
<div aria-hidden="true" class="w-full opacity-25 pointer-events-none select-none flex flex-col space-y-space-lg mb-space-2xl">
<div class="w-full bg-surface-container rounded-xl p-space-lg flex flex-col space-y-space-md">
<div class="flex justify-between items-baseline">
<span class="font-headline-sm text-headline-sm text-on-surface">Elena's Farewell Gift</span>
<span class="font-body-md text-body-md text-secondary">74%</span>
</div>
<div class="w-full h-2 bg-surface-container-lowest rounded-full overflow-hidden flex">
<div class="h-full bg-primary-container w-3/4"></div>
</div>
<div class="flex justify-between items-center text-secondary font-label-md text-label-md">
<span>3,700 / 5,000 NIM</span>
<span>14 contributors</span>
</div>
</div>
<div class="w-full bg-surface-container rounded-xl p-space-lg flex flex-col space-y-space-md">
<span class="font-label-md text-label-md text-secondary">Recent contributions</span>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface">NQ42 8K3J ... 9A2L</span>
<span class="font-body-md text-body-md text-primary font-display-currency">500 NIM</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface">NQ19 2M0P ... 44TZ</span>
<span class="font-body-md text-body-md text-primary font-display-currency">1,200 NIM</span>
</div>
</div>
</div>
<div class="w-full bg-surface-container-high rounded-t-2xl pt-space-md pb-space-lg px-space-lg flex flex-col justify-between" style="min-height: 540px;">
<div class="flex flex-col items-center w-full">
<div aria-hidden="true" class="w-9 h-1 bg-secondary-container rounded-full mb-space-lg"></div>
<h2 class="font-headline-sm text-headline-sm text-on-surface text-center tracking-tight">
        Elena's Farewell Gift
      </h2>
</div>
<div class="flex flex-col items-center my-space-xl w-full">
<div class="flex items-center justify-center space-x-1 cursor-text select-none py-space-xs" id="amount-container">
<span class="text-primary font-display-currency-mobile text-display-currency-mobile tracking-tight" id="display-amount">250</span>
<span aria-hidden="true" class="w-[3px] h-10 bg-primary animate-pulse inline-block"></span>
</div>
<div aria-label="Currency selector" class="flex items-center justify-center space-x-space-lg mt-space-md" role="tablist">
<button aria-selected="true" class="font-body-md text-body-md text-on-surface font-medium transition-colors cursor-pointer py-space-xs px-space-xs" id="btn-nim" onclick="setCurrency('NIM')" role="tab" type="button">
          NIM
        </button>
<button aria-selected="false" class="font-body-md text-body-md text-secondary transition-colors cursor-pointer py-space-xs px-space-xs" id="btn-usdt" onclick="setCurrency('USDT')" role="tab" type="button">
          USDT
        </button>
</div>
<div class="flex items-center justify-center space-x-space-xl mt-space-2xl w-full">
<button class="text-primary font-headline-sm text-headline-sm cursor-pointer p-space-xs active:opacity-60 transition-opacity" onclick="setAmount('10')" type="button">
          10
        </button>
<button class="text-primary font-headline-sm text-headline-sm cursor-pointer p-space-xs active:opacity-60 transition-opacity" onclick="setAmount('50')" type="button">
          50
        </button>
<button class="text-primary font-headline-sm text-headline-sm cursor-pointer p-space-xs active:opacity-60 transition-opacity" onclick="setAmount('100')" type="button">
          100
        </button>
<button class="text-primary font-headline-sm text-headline-sm cursor-pointer p-space-xs active:opacity-60 transition-opacity" onclick="setAmount('500')" type="button">
          500
        </button>
</div>
</div>
<div class="flex flex-col w-full space-y-space-xl">
<div class="flex items-start justify-center space-x-space-xs px-space-xs text-secondary">
<span class="material-symbols-outlined text-secondary text-[18px] leading-[20px] flex-shrink-0 mt-[1px]">info</span>
<p class="font-label-sm text-label-sm text-secondary text-left leading-tight">
          Goes directly to the pot address. Chip In never holds your money.
        </p>
</div>
<div class="w-full">
<button class="w-full h-[52px] bg-primary-container active:bg-primary text-on-primary-container font-body-md text-body-md font-medium rounded-xl flex items-center justify-center transition-colors cursor-pointer" id="submit-button" onclick="handleSend()" type="button">
          Send 250 NIM
        </button>
</div>
</div>
</div>
</div>
<script>
  let currentAmount = '250';
  let currentCurrency = 'NIM';

  function updateView() {
    const displayEl = document.getElementById('display-amount');
    const submitBtn = document.getElementById('submit-button');
    const nimBtn = document.getElementById('btn-nim');
    const usdtBtn = document.getElementById('btn-usdt');

    if (displayEl) {
      displayEl.textContent = currentAmount;
    }
    
    if (submitBtn) {
      submitBtn.textContent = 'Send ' + currentAmount + ' ' + currentCurrency;
    }

    if (nimBtn && usdtBtn) {
      if (currentCurrency === 'NIM') {
        nimBtn.className = 'font-body-md text-body-md text-on-surface font-medium transition-colors cursor-pointer py-space-xs px-space-xs';
        nimBtn.setAttribute('aria-selected', 'true');
        usdtBtn.className = 'font-body-md text-body-md text-secondary transition-colors cursor-pointer py-space-xs px-space-xs';
        usdtBtn.setAttribute('aria-selected', 'false');
      } else {
        usdtBtn.className = 'font-body-md text-body-md text-on-surface font-medium transition-colors cursor-pointer py-space-xs px-space-xs';
        usdtBtn.setAttribute('aria-selected', 'true');
        nimBtn.className = 'font-body-md text-body-md text-secondary transition-colors cursor-pointer py-space-xs px-space-xs';
        nimBtn.setAttribute('aria-selected', 'false');
      }
    }
  }

  function setAmount(val) {
    currentAmount = val;
    updateView();
  }

  function setCurrency(curr) {
    currentCurrency = curr;
    updateView();
  }

  function handleSend() {
    const btn = document.getElementById('submit-button');
    if (!btn) return;
    btn.style.opacity = '0.7';
    btn.textContent = 'Transacting...';
    setTimeout(() => {
      btn.style.opacity = '1';
      btn.textContent = 'Sent ' + currentAmount + ' ' + currentCurrency;
      setTimeout(() => {
        updateView();
      }, 1500);
    }, 600);
  }
</script></main></body></html>
