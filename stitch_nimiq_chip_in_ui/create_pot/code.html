<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=-apple-system,+BlinkMacSystemFont,+'SF+Pro',+system-ui,+sans-serif:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#0b0f34;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"inverse-surface":"#dfe0ff","primary-fixed":"#ffdf9c","surface-bright":"#32365c","on-error-container":"#ffdad6","surface-container-highest":"#2e3257","on-surface-variant":"#d3c5ad","inverse-on-surface":"#292d53","surface-container-low":"#14183d","primary":"#ffd062","tertiary-container":"#ffa19d","inverse-primary":"#785a00","surface":"#0b0f34","on-error":"#690005","secondary-container":"#3f436e","background":"#0b0f34","tertiary-fixed":"#ffdad7","on-background":"#dfe0ff","outline-variant":"#4f4633","primary-container":"#e9b213","on-primary-container":"#5f4600","secondary-fixed-dim":"#c0c3f5","surface-container":"#181c41","on-secondary":"#292d56","tertiary":"#ffc9c6","secondary-fixed":"#e0e0ff","on-tertiary-fixed-variant":"#8d131d","on-tertiary-fixed":"#410005","surface-variant":"#2e3257","on-secondary-fixed-variant":"#3f436e","surface-container-lowest":"#06092f","on-secondary-fixed":"#131740","error-container":"#93000a","on-primary-fixed-variant":"#5b4300","on-tertiary-container":"#921820","on-surface":"#dfe0ff","on-secondary-container":"#aeb1e3","secondary":"#c0c3f5","tertiary-fixed-dim":"#ffb3af","error":"#ffb4ab","outline":"#9b8f79","on-primary":"#3f2e00","surface-dim":"#0b0f34","surface-tint":"#f7be25","primary-fixed-dim":"#f7be25","on-tertiary":"#68000e","on-primary-fixed":"#251a00","surface-container-high":"#23274c"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"safe-bottom-margin":"4.5rem","space-4xl":"3.5rem","space-xxs":"0.25rem","space-3xl":"2.5rem","space-md":"1rem","space-sm":"0.75rem","space-xs":"0.5rem","space-xl":"1.5rem","space-2xl":"2rem","space-lg":"1.25rem"},"fontFamily":{"display-currency":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"label-md":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"body-lg":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"body-md":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"headline-sm":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"label-sm":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"display-currency-mobile":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""],"headline-lg":["\"-apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif\""]},"fontSize":{"display-currency":["48px",{"lineHeight":"52px","letterSpacing":"-0.03em","fontWeight":"700"}],"label-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"26px","fontWeight":"400"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-sm":["20px",{"lineHeight":"26px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"display-currency-mobile":["38px",{"lineHeight":"42px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg":["28px",{"lineHeight":"34px","letterSpacing":"-0.015em","fontWeight":"600"}]}}}};</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface active:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface truncate px-space-xs">Pool Settings</h1><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col w-full px-space-lg pt-14 pb-safe bg-surface"><div class="flex flex-col w-full">
<!-- Main Form Content -->
<div class="flex flex-col w-full space-y-space-2xl pb-32">
<!-- Screen Header -->
<div class="pt-space-xs">
<h2 class="font-headline-lg text-headline-lg text-on-surface">New pot</h2>
</div>
<!-- Field 1: Pot Name -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="pot-name">Pot name</label>
<div class="w-full bg-surface-container-high rounded-xl h-14 flex items-center px-space-md focus-within:bg-surface-variant transition-colors">
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none caret-primary-container" id="pot-name" placeholder="e.g. Elena's farewell gift" type="text"/>
</div>
</div>
<!-- Field 2: Goal Amount -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="goal-amount">Goal amount</label>
<div class="w-full bg-surface-container-high rounded-xl h-16 flex items-center justify-between px-space-md focus-within:bg-surface-variant transition-colors">
<div class="flex items-baseline flex-1 min-w-0 pr-space-xs">
<input class="w-full bg-transparent font-display-currency-mobile text-display-currency-mobile text-primary-container focus:outline-none caret-primary-container tabular-nums" id="goal-amount" inputmode="decimal" type="text" value="5,000"/>
</div>
<!-- Plain Text Currency Toggle (No Pills, No Dividers) -->
<div class="flex items-center space-x-space-md flex-shrink-0" id="currency-toggle">
<button class="font-body-md text-body-md text-on-surface font-medium transition-colors" data-currency="NIM" onclick="selectCurrency('NIM')" type="button">
            NIM
          </button>
<button class="font-body-md text-body-md text-on-surface-variant/60 transition-colors" data-currency="USDT" onclick="selectCurrency('USDT')" type="button">
            USDT
          </button>
</div>
</div>
</div>
<!-- Field 3: Who gets paid -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="payout-address">Who gets paid</label>
<div class="w-full bg-surface-container-high rounded-xl h-14 flex items-center justify-between px-space-md focus-within:bg-surface-variant transition-colors">
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none caret-primary-container truncate pr-space-xs tabular-nums" id="payout-address" placeholder="NQ24 7G0H 9F18..." type="text"/>
<button class="text-on-surface-variant/70 active:text-on-surface font-label-md text-label-md flex-shrink-0 pl-space-xs transition-colors" id="paste-btn" onclick="handlePaste()" type="button">
          Paste
        </button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/60 pt-space-xxs">
        Locked once the pot is created. Everyone can see it.
      </p>
</div>
<!-- Field 4: Repeats -->
<div class="flex flex-col space-y-space-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Repeats</span>
<div class="flex items-center space-x-space-xl" id="repeat-options">
<button class="font-body-md text-body-md text-on-surface font-medium transition-colors" data-repeat="Once" onclick="selectRepeat('Once')" type="button">
          Once
        </button>
<button class="font-body-md text-body-md text-on-surface-variant/60 transition-colors" data-repeat="Weekly" onclick="selectRepeat('Weekly')" type="button">
          Weekly
        </button>
<button class="font-body-md text-body-md text-on-surface-variant/60 transition-colors" data-repeat="Monthly" onclick="selectRepeat('Monthly')" type="button">
          Monthly
        </button>
</div>
</div>
</div>
<!-- Bottom Fixed Zone -->
<div class="fixed bottom-0 inset-x-0 px-space-lg pb-safe pointer-events-none z-40">
<div class="py-space-md pointer-events-auto">
<button class="w-full h-14 bg-primary-container active:brightness-95 text-surface-container-lowest font-body-md text-body-md font-medium rounded-xl flex items-center justify-center transition-all" id="submit-pot" type="button">
        Create pot
      </button>
</div>
</div>
</div>
<script>
  function selectCurrency(curr) {
    const buttons = document.querySelectorAll('#currency-toggle button');
    buttons.forEach(btn => {
      const isSelected = btn.getAttribute('data-currency') === curr;
      btn.className = isSelected 
        ? 'font-body-md text-body-md text-on-surface font-medium transition-colors' 
        : 'font-body-md text-body-md text-on-surface-variant/60 transition-colors';
    });
  }

  function selectRepeat(val) {
    const buttons = document.querySelectorAll('#repeat-options button');
    buttons.forEach(btn => {
      const isSelected = btn.getAttribute('data-repeat') === val;
      btn.className = isSelected 
        ? 'font-body-md text-body-md text-on-surface font-medium transition-colors' 
        : 'font-body-md text-body-md text-on-surface-variant/60 transition-colors';
    });
  }

  async function handlePaste() {
    const input = document.getElementById('payout-address');
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text) {
          input.value = text.trim();
          return;
        }
      }
    } catch (e) {
      // Fallback if clipboard access is denied
    }
    input.value = 'NQ24 7G0H 9F18 2KA0 B4LM 8109';
  }
</script></main></body></html>
