  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 inset-x-0 z-50 bg-surface pt-safe"><div class="h-14 px-space-md flex items-center justify-between"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center text-secondary hover:text-on-surface active:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface truncate px-space-xs">Transaction Confirmation</h1><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col w-full px-space-lg pt-14 pb-safe bg-surface"><div class="flex flex-col w-full min-h-[calc(100vh-3.5rem)] justify-between pb-space-lg">
<!-- Spacer to vertically balance the hero confirmation -->
<div class="w-full flex-1 flex flex-col items-center justify-center text-center px-space-xs">
<!-- Bare Amber Checkmark Line Icon (No enclosing circle, tile, or background) -->
<div class="mb-space-xl flex items-center justify-center">
<svg aria-hidden="true" class="w-12 h-12 text-primary-container" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 48 48">
<polyline points="9 25 19 35 39 13"></polyline>
</svg>
</div>
<!-- Status Heading -->
<h2 class="font-headline-lg text-headline-lg text-inverse-surface tracking-tight">
      Sent
    </h2>
<!-- Large Tabular Amount -->
<div class="mt-space-xs mb-space-sm">
<span class="font-display-currency-mobile text-display-currency-mobile text-primary-container tracking-tight tabular-nums">
        250 NIM
      </span>
</div>
<!-- Pool Context Subtitle -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      The pot is now 62% full
    </p>
<!-- Visual Pool Status Block: Monolithic, flat tonal distinction, no borders/shadows -->
<div class="w-full mt-space-3xl p-space-lg rounded-xl bg-surface-container text-left">
<div class="flex items-center justify-between font-label-md text-label-md text-on-surface-variant mb-space-sm">
<span>Weekend getaway</span>
<span class="tabular-nums text-inverse-surface">3,100 / 5,000 NIM</span>
</div>
<!-- Segmented Track (12px height, recessed navy track, amber segment) -->
<div aria-valuemax="100" aria-valuemin="0" aria-valuenow="62" class="w-full h-3 rounded-full bg-surface-container-lowest overflow-hidden flex" role="progressbar">
<div class="h-full bg-primary-container rounded-full" style="width: 62%;"></div>
</div>
</div>
</div>
<!-- Bottom Action Group: Single Primary CTA + quiet text-only link -->
<div class="w-full flex flex-col items-center gap-space-md pt-space-lg">
<!-- Primary CTA: Solid Amber, rounded-xl (not pill), minimum 52px height -->
<button class="w-full h-[52px] bg-primary-container text-surface-container-lowest font-body-md text-body-md font-medium rounded-xl flex items-center justify-center active:opacity-90 transition-opacity" type="button">
      Back to pot
    </button>
<!-- Secondary Quiet Link: Plain text, no tile or border -->
<button class="w-full h-11 flex items-center justify-center text-on-surface-variant hover:text-inverse-surface font-body-md text-body-md transition-colors" type="button">
      Share this pot
    </button>
</div>
</div></main></body></html>
